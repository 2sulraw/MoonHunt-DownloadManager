[workspace]
resolver = "2"
members = ["crates/core", "app"]

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT"

[profile.dev]
# Unoptimized egui/taffy spends most of the frame in layout and tessellation;
# O1 for everything keeps scrolling and window drags smooth in dev builds,
# while `debug = 1` (line tables only) keeps codegen memory sane.
opt-level = 1
debug = 1

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
