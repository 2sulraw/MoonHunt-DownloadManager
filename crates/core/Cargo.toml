[package]
name = "moonhunt-core"
version.workspace = true
edition.workspace = true
description = "MoonHunt backend core: aria2 RPC, yt-dlp, SQLite, extension bridge"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "process"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2"
base64 = "0.22"
zip = "2"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
regex = "1"
semver = "1"
once_cell = "1"
lazy_static = "1"
sysinfo = "0.30"
arboard = "3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
runas = "1"

[dev-dependencies]
tempfile = "3"
